bars:
  primary_bar:
    enabled: true
    screens:
      - '*'
    class_name: "yasb_bar"
    alignment:
      position: "top"
      align: "center"
    window_flags:
      windows_app_bar: true
      hide_on_fullscreen: false
    dimensions:
      width: "100%"
      height: 28
    padding:
      top: 2
      bottom: 2
      left: 4
      right: 4
    blur_effect:
      enabled: true
      dark_mode: true
    widgets:
      left: []
      center:
        - type: "clock"
      right: []