debug: true
bars:
  primary_bar:
    enabled: true
    screens:
      - '*'
    class_name: "yasb_bar"
    alignment:
      position: "top"
      align: "center"
    window_flags:
      windows_app_bar: true
      hide_on_fullscreen: false
    dimensions:
      width: "100%"
      height: 28
    padding:
      top: 2
      bottom: 2
      left: 4
      right: 4
    blur_effect:
      enabled: true
      dark_mode: true
    widgets:
      left:
      - active_window
      center: []
      right: []
widgets:
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false